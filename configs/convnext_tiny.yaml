# Configuration for ConvNeXt-Tiny (Modern ConvNet architecture comparison)
experiment_name: "convnext_tiny_color_aug"
seed: 42

model:
  backbone: "convnext_tiny"
  num_classes: 12
  pretrained: true
  dropout_rate: 0.4

data:
  splits_file: "dataset/splits.json"
  img_size: 224
  batch_size: 32
  num_workers: 0
  color_aug: true
  jitter:
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1
  grayscale_p: 0.2

train:
  epochs_stage1: 5
  lr_stage1: 0.001
  epochs_stage2: 12
  lr_backbone_stage2: 0.00005
  lr_head_stage2: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  early_stopping_patience: 4
  device: "auto"

output:
  checkpoint_dir: "outputs/checkpoints"
  metrics_dir: "outputs/metrics"
  figures_dir: "outputs/figures"
