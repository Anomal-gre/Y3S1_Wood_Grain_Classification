# Configuration for ResNet18 Ablation (NO color augmentation)
experiment_name: "resnet18_no_color_aug"
seed: 42

model:
  backbone: "resnet18"
  num_classes: 12
  pretrained: true
  dropout_rate: 0.4

data:
  splits_file: "dataset/splits.json"
  img_size: 200
  batch_size: 64
  num_workers: 0
  color_aug: false

train:
  epochs_stage1: 5
  lr_stage1: 0.001
  epochs_stage2: 10
  lr_backbone_stage2: 0.0001
  lr_head_stage2: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  early_stopping_patience: 4
  device: "auto"

output:
  checkpoint_dir: "outputs/checkpoints"
  metrics_dir: "outputs/metrics"
  figures_dir: "outputs/figures"
