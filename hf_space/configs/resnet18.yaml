# Configuration for ResNet18 (Main model - Two Stage Transfer Learning)
experiment_name: "resnet18_color_aug"
seed: 42

# Model architecture
model:
  backbone: "resnet18"
  num_classes: 12
  pretrained: true
  dropout_rate: 0.4

# Dataset and augmentation
data:
  splits_file: "dataset/splits.json"
  img_size: 200
  batch_size: 64
  num_workers: 0
  color_aug: true
  jitter:
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1
  grayscale_p: 0.2

# Two-stage Training
train:
  epochs_stage1: 5
  lr_stage1: 0.001
  epochs_stage2: 10
  lr_backbone_stage2: 0.0001
  lr_head_stage2: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  early_stopping_patience: 4
  device: "auto"

# Output directories
output:
  checkpoint_dir: "outputs/checkpoints"
  metrics_dir: "outputs/metrics"
  figures_dir: "outputs/figures"
